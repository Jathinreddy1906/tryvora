<!-- templates/404.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tryvora – Page Not Found</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0a1e;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .num  { font-size: 6rem; font-weight: 800;
                background: linear-gradient(135deg,#a78bfa,#60a5fa);
                -webkit-background-clip:text;
                -webkit-text-fill-color:transparent; }
        h2   { font-size: 1.4rem; color: #e2e8f0; margin: 12px 0; }
        p    { color: #64748b; margin-bottom: 30px; }
        a    {
            display: inline-block;
            background: linear-gradient(135deg,#7c3aed,#4f46e5);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div>
        <div class="num">404</div>
        <h2>Page Not Found</h2>
        <p>This page doesn't exist in Tryvora.</p>
        <a href="/">← Go Home</a>
    </div>
</body>
</html>
